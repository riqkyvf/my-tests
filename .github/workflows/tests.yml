name: PomidorQA tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

env:
  TEST_SUITE: ${{ inputs.suite || 'smoke' }}

# Не прерываем работающие тесты: фикстурам нужно завершить очистку аккаунтов.
concurrency:
  group: pomidorqa-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Ruff and Chromium tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Set up Node.js for Allure
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run selected test suite
        id: tests
        shell: bash
        run: |
          case "$TEST_SUITE" in
            smoke)
              test_targets=(-m smoke)
              ;;
            full)
              test_targets=()
              ;;
            *)
              printf 'Unknown test suite: %s\n' "$TEST_SUITE" >&2
              exit 2
              ;;
          esac

          python -m pytest "${test_targets[@]}" \
            --browser chromium \
            --reruns 1 \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --output=test-results \
            --alluredir=allure-results \
            --clean-alluredir

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() && hashFiles('test-results/**/trace*.zip', 'test-results/**/test-failed-*.png') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: error
          retention-days: 7

      - name: Generate Allure report
        if: ${{ !cancelled() && hashFiles('allure-results/*-result.json') != '' }}
        run: >-
          npx --yes allure@3.21.0 awesome allure-results
          --single-file
          --output allure-report
          --group-by feature
          --report-language ru

      - name: Upload Allure results
        if: ${{ !cancelled() && hashFiles('allure-results/*-result.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Allure HTML report
        if: ${{ !cancelled() && hashFiles('allure-report/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: error
          retention-days: 7
